<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Image Scanner - dBiller</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .scan-line {
            background: linear-gradient(to bottom, rgba(19, 127, 236, 0) 0%, #137fec 50%, rgba(19, 127, 236, 0) 100%);
            box-shadow: 0 0 15px rgba(19, 127, 236, 0.6);
        }
        .corner-bracket {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #137fec;
            border-style: solid;
            border-width: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display h-screen w-full overflow-hidden select-none">
<div class="relative h-full w-full flex flex-col group/design-root">
<!-- 1. Camera Feed Layer -->
<div class="absolute inset-0 z-0 bg-gray-900">
<!-- Placeholder for camera feed -->
<img class="w-full h-full object-cover opacity-60" data-alt="Close up of a receipt and office supplies on a wooden desk" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB94afg0xjFR4BtQ2Urvq-lukP1RnP7XKTWeefOSj70APR-KHvMEkeE_B3MlXEWaPDqCG3RXoxUbdPgAelvQ1ysYGkbyYHbRrTav198MFSnyQZX0QPMVyLuG1H1_TMwEqMmlUvYOLu54hzOxtmqdNBwPsgHnwGwDdEUphW_B3cIAfRVrMrFhfjm4q8aXIlS7K9V1f3aAyGqEnbGTULP_JbD669Y6VHgbcKit9s_vivgI8X42xUBmnLRBpJ2J79h-dx2IEVZvqkEt4hz"/>
<!-- Vignette overlay for better UI contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80"></div>
</div>
<!-- 2. AR Overlay Layer (Bounding Boxes & Intelligence) -->
<div class="absolute inset-0 z-10 pointer-events-none p-6 flex flex-col justify-center items-center">
<!-- Main Object Bounding Box -->
<div class="relative w-full max-w-sm aspect-[3/5] border border-primary/30 rounded-lg bg-primary/5">
<!-- Animated corners for high-tech feel -->
<div class="corner-bracket top-0 left-0 border-t-4 border-l-4 rounded-tl-lg"></div>
<div class="corner-bracket top-0 right-0 border-t-4 border-r-4 rounded-tr-lg"></div>
<div class="corner-bracket bottom-0 left-0 border-b-4 border-l-4 rounded-bl-lg"></div>
<div class="corner-bracket bottom-0 right-0 border-b-4 border-r-4 rounded-br-lg"></div>
<!-- Confidence Badge -->
<div class="absolute -top-10 left-0 bg-background-dark/80 backdrop-blur-md border border-primary/30 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2 shadow-lg animate-pulse">
<span class="material-symbols-outlined text-primary text-[16px]">receipt_long</span>
<span class="font-medium">Invoice Detected: 98%</span>
</div>
<!-- Detected Text Highlights (Simulated) -->
<div class="absolute top-[20%] left-[10%] w-[40%] h-4 bg-primary/20 rounded-sm border border-primary/40"></div>
<div class="absolute top-[25%] left-[10%] w-[60%] h-4 bg-primary/20 rounded-sm border border-primary/40"></div>
<div class="absolute top-[35%] right-[10%] w-[20%] h-6 bg-yellow-500/20 rounded-sm border border-yellow-500/50 flex items-center justify-center">
<span class="text-[8px] font-bold text-yellow-300">$142.50</span>
</div>
<!-- Scanning Line Effect -->
<div class="absolute top-[40%] left-0 w-full h-1 scan-line opacity-80"></div>
</div>
</div>
<!-- 3. Top Control Bar -->
<div class="absolute top-0 w-full z-20 pt-12 pb-4 px-5 flex justify-between items-start bg-gradient-to-b from-black/70 to-transparent">
<!-- Flash Toggle -->
<button class="flex size-10 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">flash_off</span>
</button>
<!-- Mode Indicator / Title -->
<div class="flex flex-col items-center">
<span class="text-xs font-bold uppercase tracking-widest text-white/60 mb-0.5">dBiller AI</span>
<span class="text-sm font-semibold text-white drop-shadow-md">Scan &amp; Capture</span>
</div>
<!-- Close Button -->
<button class="flex size-10 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">close</span>
</button>
</div>
<!-- 4. Bottom Controls Area -->
<div class="absolute bottom-0 w-full z-20 flex flex-col items-center pb-8 pt-12 bg-gradient-to-t from-background-dark via-background-dark/90 to-transparent">
<!-- Helper Text -->
<p class="text-white/80 text-sm font-medium mb-6 text-center drop-shadow-md px-8 animate-bounce">
                Align bill within frame to auto-scan
            </p>
<!-- Mode Switcher (Segmented Control) -->
<div class="flex p-1 bg-black/40 backdrop-blur-xl rounded-full mb-8 border border-white/10 relative shadow-2xl">
<label class="relative z-10 cursor-pointer">
<input class="peer sr-only" name="scan_mode" type="radio" value="item"/>
<div class="px-6 py-2 rounded-full text-sm font-medium text-white/70 peer-checked:text-white transition-colors duration-200">
                        Item Mode
                    </div>
</label>
<label class="relative z-10 cursor-pointer">
<input checked="" class="peer sr-only" name="scan_mode" type="radio" value="bill"/>
<div class="px-6 py-2 rounded-full text-sm font-medium text-white/70 peer-checked:text-white transition-colors duration-200">
                        Bill Mode
                    </div>
</label>
<!-- Animated Background Pill (Visual representation of state) -->
<div class="absolute right-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full shadow-lg transition-all duration-300 pointer-events-none"></div>
</div>
<!-- Camera Actions Grid -->
<div class="grid grid-cols-3 w-full max-w-sm items-center gap-4 px-6">
<!-- Left: Gallery -->
<div class="flex justify-center">
<button class="size-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition-all border border-white/5">
<span class="material-symbols-outlined">photo_library</span>
</button>
</div>
<!-- Center: Shutter Button -->
<div class="flex justify-center">
<button class="size-20 rounded-full border-[5px] border-white/20 flex items-center justify-center bg-transparent relative group active:scale-95 transition-transform duration-150">
<!-- Inner Circle -->
<div class="size-16 bg-white rounded-full shadow-[0_0_20px_rgba(255,255,255,0.3)] group-active:scale-90 transition-transform"></div>
<!-- Primary Ring for brand identity -->
<div class="absolute inset-1 rounded-full border-2 border-primary/0 group-hover:border-primary/50 transition-colors"></div>
</button>
</div>
<!-- Right: Manual Entry / Spiral -->
<div class="flex justify-center">
<button class="size-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition-all border border-white/5">
<span class="material-symbols-outlined">edit_document</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
