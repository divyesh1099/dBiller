<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>License Activation - dBiller</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#137fec",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar (iOS Style) -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">License Activation</h2>
</div>
<div class="h-8 bg-background-light dark:bg-background-dark"></div>
<!-- Brand/Logo Icon Placeholder -->
<div class="flex justify-center mb-6">
<div class="bg-primary/20 p-4 rounded-xl">
<span class="material-symbols-outlined text-primary text-[48px]">account_balance_wallet</span>
</div>
</div>
<!-- HeadlineText -->
<div class="px-6">
<h2 class="text-slate-900 dark:text-white tracking-light text-[28px] font-bold leading-tight text-center pb-3">Activate Your Account</h2>
</div>
<!-- BodyText -->
<div class="px-8">
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed pb-3 pt-1 text-center">
                Enter the 16-digit license key provided in your welcome email to set up your organization and begin billing.
            </p>
</div>
<!-- TextField with Validation -->
<div class="flex flex-col items-center gap-4 px-6 py-6">
<label class="flex flex-col w-full max-w-[400px]">
<p class="text-slate-900 dark:text-white text-sm font-semibold leading-normal pb-2 uppercase tracking-wider">License Key</p>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] p-[15px] rounded-r-none border-r-0 text-lg font-mono leading-normal tracking-widest" placeholder="XXXX - XXXX - XXXX - XXXX" type="text" value="DBIL-4921-X920"/>
<div class="text-emerald-500 flex border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] items-center justify-center pr-[15px] rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-[24px]">check_circle</span>
</div>
</div>
<p class="text-emerald-600 dark:text-emerald-400 text-xs font-medium mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified</span> Key valid: Enterprise Plan
                </p>
</label>
</div>
<!-- MetaText -->
<div class="px-6 flex justify-center">
<button class="text-primary text-sm font-medium leading-normal pb-3 pt-1 hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">help_outline</span>
                Where can I find my license key?
            </button>
</div>
<div class="mt-auto px-6 pb-12 flex flex-col gap-4">
<!-- Primary Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-14 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Activate Organization</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Secondary Action -->
<button class="w-full bg-transparent text-slate-500 dark:text-slate-400 font-medium h-12 rounded-xl transition-all flex items-center justify-center">
                Contact Support
            </button>
</div>
<!-- Decorative Image/Pattern Background -->
<div class="fixed bottom-0 left-0 right-0 h-1/4 -z-10 opacity-10 pointer-events-none overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-primary to-transparent" data-alt="Abstract blue gradient pattern at bottom"></div>
</div>
</div>
</body></html>
