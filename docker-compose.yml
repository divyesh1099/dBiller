version: '3.8'
services:
  db:
    image: postgres:15
    container_name: dbiller_db_local
    environment:
      POSTGRES_USER: dbiller_user
      POSTGRES_PASSWORD: dbiller_password
      POSTGRES_DB: dbiller_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dbiller_backend
    depends_on:
      - db
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://dbiller_user:dbiller_password@db:5432/dbiller_dev
      - SECRET_KEY=e506d5d8a7c9bf23b6d19f72883cf95843cce3be91f8a57077105b9d7e78faaa
      # Include other env vars as needed, or use env_file
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
